

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Life Tracker</title>
    <meta name="description" content="Life Tracker — a simple app to monitor habits, goals, moods and daily activities to help you build healthier routines and reach long-term objectives." />
</head>
<body>
    <main>
        <h1>Life Tracker</h1>
        <p>Track habits, set goals, log moods and daily activities, and visualize progress to build consistent, healthy routines.</p>

        <section>
            <h2>Key features</h2>
            <ul>
                <li>Create and track daily habits</li>
                <li>Set goals with milestones and deadlines</li>
                <li>Log moods and notes</li>
                <li>View progress and streaks over</li>
            </ul>
        </section>
        <section>
            <button onclick="">Lecture or Workshop missed</button>
        </section>
        <section>
            <h1>My Quote Book</h1>

            <!-- Input bar + save button -->
            <input id="quoteInput" type="text" placeholder="Enter a quote" />
            <button id="saveBtn">Save Quote</button>

            <!-- Show quotes button -->
            <button id="showBtn">Show All Quotes</button>

            <!-- Container for quotes -->
            <ul id="quoteList"></ul>

            <script type="module" src="QuoteBook.js"></script>
        </section>
    </main>
</body>
</html>
